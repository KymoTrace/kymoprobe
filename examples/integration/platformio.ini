[platformio]
default_envs = esp32dev

[env]
framework = arduino
lib_deps = KymoCore=symlink://../../lib/KymoCore
monitor_speed = 115200
build_flags =
    -I include
    -DKYMO_USER_CONFIG_HEADER=\"kymo_user_config.h\"

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev

[env:uno]
platform = atmelavr@5.3.0
board = uno
; Keep Plot, Param, Watch and Memory; full Trace exceeds the Uno RAM budget.
build_flags =
    ${env.build_flags}
    -DKYMO_ENABLE_TRACE=0
