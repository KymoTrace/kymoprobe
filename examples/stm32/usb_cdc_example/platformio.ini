[env:bluepill_f103c8]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = arduino
lib_deps =
    KymoCore=symlink://../../../lib/KymoCore
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
build_flags = -DKYMO_ENABLE_ENDPOINT=1 -DKYMO_ENABLE_TX=1 -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -DKYMO_ENABLE_TIMESTAMP=1
upload_protocol = stlink
monitor_speed = 115200
