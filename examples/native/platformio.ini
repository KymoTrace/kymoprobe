[env:native]
platform = native
lib_deps =
    KymoCore=symlink://../../lib/KymoCore
    ProbeEndpoint=symlink://../../lib/ProbeEndpoint
build_flags = -DKYMO_ENABLE_ENDPOINT=1 -DKYMO_ENABLE_TX=1 -Wall -Wextra -Werror -DKYMO_ENABLE_X=1 -DKYMO_ENABLE_Z=1 -DKYMO_ENABLE_TIMESTAMP=1 -DKYMO_ENABLE_DECODER=1
build_src_flags = -std=c++11
