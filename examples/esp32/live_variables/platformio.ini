[platformio]
default_envs = esp32-live-variables

; Needs KymoCore live variables (KymoWatch, 7.3). Until 7.3.0 is tagged, this
; builds against the KymoCore checkout next to KymoProbe (branch feat/live-variables);
; afterwards switch lib_deps to ../../../lib/KymoCore like the other examples.
[env:esp32-live-variables]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../../KymoCore
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
    -DKYMO_ENABLE_DECODER=1
    -DKYMO_ENABLE_WATCH=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py
