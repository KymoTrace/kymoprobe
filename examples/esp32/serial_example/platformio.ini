[env]
build_flags = -DKYMO_ENABLE_ENDPOINT=1 -DKYMO_ENABLE_TX=1
    -DKYMO_ENABLE_TIMESTAMP=1

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =

    KymoCore=symlink://../../../lib/KymoCore
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
monitor_speed = 115200

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =

    KymoCore=symlink://../../../lib/KymoCore
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
monitor_speed = 115200

[env:esp32-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =

    KymoCore=symlink://../../../lib/KymoCore
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
monitor_speed = 115200
