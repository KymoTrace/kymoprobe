[platformio]
default_envs = esp32-benchmark-bitwise

; CPU cost of KymoCore on the ESP32, measured with the cycle counter (CCOUNT).
; Two builds differ only in KYMO_ENABLE_CRC_TABLE, so the CRC effect is visible.
; Builds against the KymoCore checkout next to KymoProbe until 7.3.0 is tagged;
; afterwards switch lib_deps to ../../../lib/KymoCore like the other examples.
[env]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../../KymoCore
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
    -DKYMO_ENABLE_TRACE=1
    -DKYMO_ENABLE_MEMORY=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py

[env:esp32-benchmark-bitwise]

[env:esp32-benchmark-table]
build_flags =
    ${env.build_flags}
    -DKYMO_ENABLE_CRC_TABLE=1
