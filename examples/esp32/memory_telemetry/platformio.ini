[platformio]
default_envs = esp32-memory-telemetry

; Needs KymoCore memory telemetry (KymoMemory, 7.3). Until 7.3.0 is tagged, this
; builds against the KymoCore checkout next to KymoProbe (branch develop);
; afterwards switch lib_deps to ../../../lib/KymoCore like the other examples.
[env:esp32-memory-telemetry]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../../KymoCore
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
    -DKYMO_ENABLE_MEMORY=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py
