[platformio]
default_envs = esp32-memory-telemetry

; Uses the official KymoCore release pinned in lib/KymoCore.
[env:esp32-memory-telemetry]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps =
    KymoCore=symlink://../../../lib/KymoCore
    ProbeEndpoint=symlink://../../../lib/ProbeEndpoint
build_flags = -DKYMO_ENABLE_ENDPOINT=1 -DKYMO_ENABLE_TX=1
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
    -DKYMO_ENABLE_MEMORY=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py
