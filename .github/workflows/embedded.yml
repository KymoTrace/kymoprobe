name: Embedded library
on: [push, pull_request]

jobs:
  core-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - run: python3 tools/check_core_version.py
      - run: python3 -m unittest discover -s tools -p test_core_version.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # lib/KymoCore kommt aus KymoTrace/kymocore
      - run: pip install platformio==6.2.0
      - name: Validate archive and build its documented consumers
        run: python3 tools/test_package.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # lib/KymoCore kommt aus KymoTrace/kymocore
          fetch-depth: 0
      - name: C99 and C++11 behavior tests
        run: python3 tools/test_native.py
      - name: Configuration and stress contracts
        run: |
          python3 tools/test_probe_config.py
          python3 tools/test_stress_demo.py
          python3 tools/test_features_demo.py
      - name: Fetch released Studio decoder for the producer-to-consumer check
        run: |
          curl --fail --location --retry 3 --output studio-sources.zip https://kymotrace.de/downloads/v2.1.1/KymoStudio_2.1.1_Sources.zip
          echo '68278e1f831cf79279ff7e8641119c406a6fcea130098bf8298730db06dc2473  studio-sources.zip' | sha256sum --check
          python3 - <<'PY'
          import io
          import zipfile
          with zipfile.ZipFile('studio-sources.zip') as release:
              source = release.read('legal/sources/KymoStudio-application-source.zip')
          with zipfile.ZipFile(io.BytesIO(source)) as application:
              application.extractall('.')
          PY
      - name: Native KymoTrace producer and Studio reconstruction
        run: python3 tools/test_trace_demo.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: .
            environment: nodemcu-32s
          - project: .
            environment: nodemcu-32s-development
          - project: .
            environment: nodemcu-32s-production
          - project: .
            environment: nodemcu-32s-mqtt
          - project: .
            environment: nodemcu-32s-tcp
          - project: .
            environment: nodemcu-32s-network
          - project: .
            environment: nodemcu-32s-stress-usb
          - project: .
            environment: nodemcu-32s-stress-tcp
          - project: .
            environment: nodemcu-32s-stress-tcp-xyz
          - project: .
            environment: nodemcu-32s-stress-udp
          - project: .
            environment: nodemcu-32s-features
          - project: .
            environment: nodemcu-32s-trace
          - project: .
            environment: nodemcu-32s-trace-production
          - project: .
            environment: nodemcu-32s-trace-flow
          - project: examples/arduino/simple_analog_example
            environment: uno
          - project: examples/arduino/multi_sensor_example
            environment: uno
          - project: examples/esp32/serial_example
            environment: esp32dev
          - project: examples/esp32/wifi_mqtt_example
            environment: esp32dev
          - project: examples/esp32/text_signals
            environment: esp32-text-signals
          - project: examples/esp32/stack_reserve
            environment: esp32-stack-reserve
          - project: examples/esp32/pi_controller
            environment: esp32-pi-controller
          - project: examples/esp32/live_variables
            environment: esp32-live-variables
          - project: examples/esp32/memory_telemetry
            environment: esp32-memory-telemetry
          - project: examples/esp32/kymocore_benchmark
            environment: esp32-benchmark-bitwise
          - project: examples/esp32/kymocore_benchmark
            environment: esp32-benchmark-table
          - project: examples/integration
            environment: esp32dev
          - project: examples/integration
            environment: uno
          - project: examples/esp32/measurement_signals
            environment: esp32-measurement-signals
          - project: examples/esp32/runtime_freertos
            environment: esp32-runtime-test
          - project: examples/esp32/task_trace_example
            environment: esp32-runtime-test
          - project: examples/native
            environment: native
          - project: examples/stm32/usb_cdc_example
            environment: bluepill_f103c8
          - project: examples/esp32/trace_uart
            environment: esp32-trace
          - project: examples/stm32/uart_example
            environment: nucleo_f401re
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # lib/KymoCore kommt aus KymoTrace/kymocore
      - run: pip install platformio==6.2.0
      - name: Provide placeholder network credentials for compilation
        run: |
          cp include/network_secrets.h.example include/network_secrets.h
          echo '#define KYMO_STRESS_UDP_HOST "192.0.2.1"' >> include/network_secrets.h
      - run: pio run -d ${{ matrix.project }} -e ${{ matrix.environment }}
